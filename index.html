function getCompletedCount(){ var c=0; for(var k in progressData){ if(progressData[k].normal>=100) c++; } return c; }
function countCompletedByDifficulty(diff){
  var c=0;
  for(var i=0; i<LEVELS.length; i++){
    if(LEVELS[i].difficulty===diff && getProgressForLevel(i,'normal')>=100) c++;
  }
  return c;
}
function countCompletedDemons(){
  var c=0;
  for(var i=0; i<LEVELS.length; i++){
    if(LEVELS[i].difficulty.indexOf('Demon')>=0 && getProgressForLevel(i,'normal')>=100) c++;
  }
  return c;
}
function getTotalStars(){
  var s=0;
  for(var i=0; i<LEVELS.length; i++){
    if(getProgressForLevel(i,'normal')>=100) s += LEVELS[i].starCount;
  }
  return s;
}
function checkAchievements(){
  var unlocked=false;
  for(var i=0; i<ACHIEVEMENTS_LIST.length; i++){
    var a=ACHIEVEMENTS_LIST[i];
    if(!achievements[a.id] && a.check()){ achievements[a.id]=true; unlocked=true; }
  }
  if(unlocked){ saveAchievements(); }
  return unlocked;
}

function playNote(freq, dur, type, vol){
  if(!actx) return;
  try{
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.04;
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}
function playDrum(vol){
  if(!actx) return;
  try{
    var bufferSize = actx.sampleRate * 0.05;
    var buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    var data = buffer.getChannelData(0);
    for(var i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
    var src = actx.createBufferSource();
    src.buffer = buffer;
    var g = actx.createGain();
    g.gain.setValueAtTime(vol || 0.03, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.05);
    var filter = actx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 3000;
    src.connect(filter); filter.connect(g); g.connect(actx.destination);
    src.start();
  }catch(e){}
}
var musicTimer = null, musicBeat = 0, musicPlaying = false;
function startMusic(){
  stopMusic();
  if(!actx) return;
  musicBeat = 0;
  musicPlaying = true;
  var pattern = MUSIC_PATTERNS[currentLevel] || MUSIC_PATTERNS[0];
  var beatDur = 60000 / pattern.bpm / 2;
  musicTimer = setInterval(function(){
    if(!musicPlaying || !actx) return;
    var p = MUSIC_PATTERNS[currentLevel] || MUSIC_PATTERNS[0];
    var beat = musicBeat % p.melody.length;
    var bassBeat = musicBeat % p.bass.length;
    playNote(p.melody[beat], p.epic ? 0.1 : 0.15, p.waveType, p.volume);
    if(musicBeat % 2 === 0){
      playNote(p.bass[bassBeat] / 2, p.epic ? 0.18 : 0.2, 'triangle', p.volume * 0.9);
    }
    if(p.epic){
      if(musicBeat % 2 === 0) playDrum(0.025);
      if(musicBeat % 4 === 0) playNote(p.bass[bassBeat] / 4, 0.35, 'sine', 0.06);
    } else {
      if(musicBeat % 2 === 1) playDrum(0.02);
    }
    musicBeat++;
  }, beatDur);
}
function stopMusic(){
  musicPlaying = false;
  if(musicTimer){ clearInterval(musicTimer); musicTimer = null; }
}

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    this.beginPath();

    this.quadraticCurveTo(x+w, y, x+w, y+r);
    this.lineTo(x+w, y+h-r);
    this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    this.lineTo(x+r, y+h);
    this.quadraticCurveTo(x, y+h, x, y+h-r);
    this.lineTo(x, y+r);
    this.quadraticCurveTo(x, y, x+r, y);
    this.closePath(); return this;
  };
}

function getModeAtX(x){
  var L = LEVELS[currentLevel];
  var mode = 'cube';
  for(var i=0; i<L.modeSeq.length; i++){
    if(L.modeSeq[i].at <= x) mode = L.modeSeq[i].mode;
    else break;
  }
  return mode;
}

function isNearPortal(x, L){
  for(var i=0; i<L.modeSeq.length; i++){
    var m = L.modeSeq[i];
    if(i > 0){
      var portalX = m.at + 400;
      if(x > portalX - 100 && x < portalX + 500) return true;
    }
  }
  return false;
}

function buildLevel(){
  obstacles = []; portals = []; levelCoins = []; collectedLevelCoins = [];
  speedPortals = []; jumpPads = []; jumpRings = []; slopes = []; checkpoints = [];
  lastCheckpoint = -1;
  var L = LEVELS[currentLevel];

  for(var i=0; i<L.modeSeq.length; i++){
    var m = L.modeSeq[i];
    if(i > 0){
      portals.push({ x: m.at + 400, y: 60, w: 25, h: GROUND - 60, mode: m.mode, color: getModeData(m.mode).color });
    }
  }

  for(var ci=0; ci<L.coins.length; ci++){
    var c = L.coins[ci];
    var coinMode = getModeAtX(c.x);
    var coinY;
    
    if(isGroundMode(coinMode)){
      coinY = GROUND - 60 - Math.random() * 40;
    } else {
      coinY = GROUND - 200 - Math.random() * 200;
    }
    
    levelCoins.push({x: c.x, y: coinY, w: 40, h: 40, collected: false, spin: Math.random() * Math.PI * 2});
  }

  var x = W + 200;
  var isTidal = (L.name === 'AQUA CHAOS');
  var isBlood = (L.name === 'CRIMSON REIGN');

  while(x < L.length){
    var modeAtX = getModeAtX(x);
    var isFlying = (modeAtX === 'ship' || modeAtX === 'ufo' || modeAtX === 'wave');
    var groundMode = isGroundMode(modeAtX);

    if(isNearPortal(x, L)){
      x += 100;
      continue;
    }

    if(isTidal && modeAtX === 'wave'){
      var gap = 90 + Math.random()*60;
      obstacles.push({x: x, y: CEILING, w: 30, h: 30, type:'spike_down'});
      obstacles.push({x: x + 30, y: GROUND - 30, w: 30, h: 30, type:'spike'});
      if(Math.random() < 0.4){
        obstacles.push({x: x + 80, y: CEILING, w: 30, h: 30, type:'spike_down'});
        obstacles.push({x: x + 110, y: GROUND - 30, w: 30, h: 30, type:'spike'});
      }
      x += gap + 40;
    }
    else if(isFlying){
      var r = Math.floor(Math.random() * 5);
      var gapFly = 150 + Math.random()*100;
      if(isBlood) gapFly = 180 + Math.random()*100;
      if(r === 0){ obstacles.push({x:x, y:GROUND-260, w:70, h:40, type:'block'}); x += 400 + gapFly; }
      else if(r === 1){
        obstacles.push({x:x, y:GROUND-180, w:70, h:40, type:'block'});
        obstacles.push({x:x+200, y:GROUND-320, w:70, h:40, type:'block'});
        x += 500 + gapFly;
      }
      else if(r === 2){
        obstacles.push({x:x, y:GROUND-320, w:70, h:80, type:'block'});
        obstacles.push({x:x, y:GROUND-100, w:70, h:100, type:'block'});
        x += 450 + gapFly;
      }
      else if(r === 3){
        obstacles.push({x:x, y:GROUND-380, w:200, h:60, type:'block'});
        obstacles.push({x:x, y:GROUND-140, w:200, h:60, type:'block'});
        x += 550 + gapFly;
      }
      else {
        obstacles.push({x:x, y:GROUND-160, w:60, h:40, type:'block'});
        obstacles.push({x:x+120, y:GROUND-240, w:60, h:40, type:'block'});
        obstacles.push({x:x+240, y:GROUND-320, w:60, h:40, type:'block'});
        x += 550 + gapFly;
      }
    }
    else if(groundMode){
      var r2 = Math.floor(Math.random() * 7);
      var gap2 = 150 + Math.random()*120;
      if(isBlood) gap2 = 180 + Math.random()*100;
      if(r2 === 0){ obstacles.push({x:x, y:GROUND-30, w:30, h:30, type:'spike'}); x += 320 + gap2; }
      else if(r2 === 1){
        obstacles.push({x:x, y:GROUND-30, w:30, h:30, type:'spike'});
        obstacles.push({x:x+35, y:GROUND-30, w:30, h:30, type:'spike'});
        x += 400 + gap2;
      }
      else if(r2 === 2){
        for(var k=0; k<3; k++)
          obstacles.push({x:x+k*32, y:GROUND-30, w:30, h:30, type:'spike'});
        x += 450 + gap2;
      }
      else if(r2 === 3){
        obstacles.push({x:x, y:GROUND-30, w:150, h:30, type:'spike_pit'});
        x += 350 + gap2;
      }
      else if(r2 === 4){
        slopes.push({x: x, y: GROUND - 80, w: 120, h: 80, type: 'up'});
        x += 200 + gap2;
      }
      else if(r2 === 5){
        jumpPads.push({x: x, y: GROUND - 15, w: 50, h: 15, used: false});
        x += 300 + gap2;
      }
      else {
        jumpRings.push({x: x, y: GROUND - 200, w: 40, h: 40, used: false});
        obstacles.push({x:x+100, y:GROUND-30, w:30, h:30, type:'spike'});
        x += 400 + gap2;
      }
    }
  }

  speedPortals.push({x: L.length * 0.4, y: CEILING + 100, w: 30, h: 60, type: 'fast', color: '#ffff00'});
  speedPortals.push({x: L.length * 0.7, y: CEILING + 100, w: 30, h: 60, type: 'normal', color: '#00ff00'});
}

function burst(x, y, n, c, s){
  s = s || 4;
  for(var i=0; i<n; i++){
    particles.push({
      x:x, y:y,
      vx:(Math.random()-0.5)*s*2, vy:(Math.random()-0.5)*s*2 - 2,
      life:1, color:c, size: Math.random()*4+2
    });
  }
}

function saveProgress(percent, mode){
  if(!progressData[currentLevel]) progressData[currentLevel] = {normal: 0, practice: 0, coins: 0, coin1:false, coin2:false, coin3:false};
  if(percent > (progressData[currentLevel][mode] || 0)){
    progressData[currentLevel][mode] = percent;
  }
  try { localStorage.setItem('gd_progress', JSON.stringify(progressData)); } catch(e){}
}
function saveCoin(index){
  if(!progressData[currentLevel]) progressData[currentLevel] = {normal: 0, practice: 0, coins: 0, coin1:false, coin2:false, coin3:false};
  var key = 'coin' + (index+1);
  if(!progressData[currentLevel][key]){
    progressData[currentLevel][key] = true;
    progressData[currentLevel].coins = (progressData[currentLevel].coins || 0) + 1;
    statsData.totalCoins++;
    saveStats();
    saveProgress(progressData[currentLevel].normal, 'normal');
    checkAchievements();
  }
}
function getProgressForLevel(idx, mode){
  if(!progressData[idx]) return 0;
  return progressData[idx][mode] || 0;
}
function getCoinStatus(idx){
  if(!progressData[idx]) return [false, false, false];
  return [
    progressData[idx].coin1 || false,
    progressData[idx].coin2 || false,
    progressData[idx].coin3 || false
  ];
}

function startLevel(practice){
  practiceMode = practice;
  playing = true;
  isDead = false;   // ⬅️ FIX
  state = 'playing';
  score = 0; distance = 0;
  speed = LEVELS[currentLevel].speed;
  waveSpeedBoost = LEVELS[currentLevel].waveSpeedMultiplier || 1;
  currentMode = LEVELS[currentLevel].modeSeq[0].mode;
  player.x = 150;
  player.y = GROUND - player.h;
  player.vy = 0; player.onGround = true; player.rot = 0; player.grav = 1;
  particles = []; trail = []; collectedLevelCoins = [];
  attempt = 1;
  buildLevel();
  initAudio();
  if(actx && actx.state === 'suspended') actx.resume();
  startMusic();
  statsData.totalAttempts++;
  saveStats();
}

  isDead = false;      // ⬅️ FIX: reset flag
  playing = true;      // ⬅️ FIX: pastikan playing ON
  player.x = 150;
  player.y = GROUND - player.h;

  trail = [];

// ===== DIE dengan GUARD isDead =====
function die(){
  if(isDead) return;    // ⬅️ FIX: cegah die dipanggil 2x+
  isDead = true;
  playing = false;
  shake = 15;
  statsData.totalDeaths++;
  saveStats();
  beep(200, 0.3, 'sawtooth', 0.1);
  var c = ICON_COLORS[iconColorIndex];
  burst(player.x+20, player.y+20, 30, c, 8);
  burst(player.x+20, player.y+20, 20, '#ffffff', 6);
  var pct = Math.floor((distance / LEVELS[currentLevel].length) * 100);
  var mode = practiceMode ? 'practice' : 'normal';
  saveProgress(pct, mode);
  if(score > best){ best = score; try{localStorage.setItem('gd_best', best);}catch(e){} }
  checkAchievements();
  setTimeout(function(){
    instantRestart();
  }, 400);
}

function winGame(){
  playing = false;
  isDead = false;   // ⬅️ FIX
  state = 'levelInfo';
  stopMusic();
  beep(800, 0.1, 'square', 0.06);
  setTimeout(function(){ beep(1000,0.1,'square',0.06); },100);
  setTimeout(function(){ beep(1200,0.2,'square',0.06); },200);
  setTimeout(function(){ beep(1600,0.3,'square',0.06); },300);
  burst(player.x+20, player.y+20, 60, '#ffdd00', 10);
  if(score > best){ best = score; try{localStorage.setItem('gd_best', best);}catch(e){} }
  saveProgress(100, practiceMode ? 'practice' : 'normal');
  checkAchievements();
}

function drawDifficultyFace(cx, cy, size, difficulty){
  var s = size;
  var r = s * 0.5;
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#000';

  if(difficulty === 'Easy'){
    var gE = ctx.createRadialGradient(cx - r*0.2, cy - r*0.2, r*0.1, cx, cy, r);
    gE.addColorStop(0, '#4dd0e1'); gE.addColorStop(1, '#0088bb');
    ctx.fillStyle = gE;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx - r*0.32, cy - r*0.15, r*0.13, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r*0.32, cy - r*0.15, r*0.13, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - r*0.36, cy - r*0.22, r*0.05, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r*0.28, cy - r*0.22, r*0.05, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx, cy + r*0.15, r*0.4, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(cx - r*0.4, cy + r*0.15); ctx.lineTo(cx + r*0.4, cy + r*0.15);
    ctx.lineTo(cx + r*0.35, cy + r*0.3); ctx.lineTo(cx - r*0.35, cy + r*0.3);
    ctx.closePath(); ctx.fill();
  }
  else if(difficulty === 'Normal'){
    var gN = ctx.createRadialGradient(cx - r*0.2, cy - r*0.2, r*0.1, cx, cy, r);
    gN.addColorStop(0, '#5dff5d'); gN.addColorStop(1, '#00aa00');
    ctx.fillStyle = gN;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx - r*0.3, cy - r*0.15, r*0.16, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r*0.3, cy - r*0.15, r*0.16, 0, Math.PI*2); ctx.fill();

    ctx.beginPath(); ctx.arc(cx + r*0.26, cy - r*0.22, r*0.06, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx, cy + r*0.1, r*0.32, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(cx - r*0.32, cy + r*0.1); ctx.lineTo(cx + r*0.32, cy + r*0.1);
    ctx.lineTo(cx + r*0.26, cy + r*0.24); ctx.lineTo(cx - r*0.26, cy + r*0.24);
    ctx.closePath(); ctx.fill();
  }
  else if(difficulty === 'Hard'){
    var gH = ctx.createRadialGradient(cx - r*0.2, cy - r*0.2, r*0.1, cx, cy, r);
    gH.addColorStop(0, '#ffe066'); gH.addColorStop(1, '#ffa500');
    ctx.fillStyle = gH;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();

    ctx.beginPath(); ctx.arc(cx + r*0.28, cy - r*0.1, r*0.08, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx - r*0.25, cy + r*0.25); ctx.lineTo(cx + r*0.25, cy + r*0.25); ctx.stroke();
    ctx.lineWidth = 3;
  }
  else if(difficulty === 'Harder'){

    ctx.fillStyle = '#000';
    ctx.beginPath();

    ctx.lineTo(cx + r*0.28, cy + r*0.42); ctx.lineTo(cx - r*0.28, cy + r*0.42);

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(cx - r*0.3, cy + r*0.15); ctx.lineTo(cx - r*0.22, cy + r*0.28); ctx.lineTo(cx - r*0.14, cy + r*0.15); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx - r*0.1, cy + r*0.15); ctx.lineTo(cx - r*0.02, cy + r*0.28); ctx.lineTo(cx + r*0.06, cy + r*0.15); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + r*0.1, cy + r*0.15); ctx.lineTo(cx + r*0.18, cy + r*0.28); ctx.lineTo(cx + r*0.26, cy + r*0.15); ctx.closePath(); ctx.fill();
  }
  else if(difficulty === 'Hard Demon'){
    var gHD = ctx.createRadialGradient(cx - r*0.2, cy - r*0.2, r*0.1, cx, cy, r);
    gHD.addColorStop(0, '#ff3333'); gHD.addColorStop(1, '#880000');
    ctx.fillStyle = gHD; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx - r*0.45, cy - r*0.3); ctx.lineTo(cx - r*0.7, cy - r*0.85); ctx.lineTo(cx - r*0.18, cy - r*0.55); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + r*0.45, cy - r*0.3); ctx.lineTo(cx + r*0.7, cy - r*0.85); ctx.lineTo(cx + r*0.18, cy - r*0.55); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.moveTo(cx - r*0.45, cy - r*0.1); ctx.lineTo(cx - r*0.08, cy - r*0.05); ctx.lineTo(cx - r*0.45, cy + r*0.1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + r*0.45, cy - r*0.1); ctx.lineTo(cx + r*0.08, cy - r*0.05); ctx.lineTo(cx + r*0.45, cy + r*0.1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffff00';
    ctx.beginPath(); ctx.arc(cx - r*0.25, cy - r*0.02, r*0.05, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r*0.25, cy - r*0.02, r*0.05, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.moveTo(cx - r*0.35, cy + r*0.15); ctx.lineTo(cx + r*0.35, cy + r*0.15);
    ctx.lineTo(cx + r*0.3, cy + r*0.45); ctx.lineTo(cx - r*0.3, cy + r*0.45);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    for(var gd=0; gd<4; gd++){
      var gx = cx - r*0.3 + gd * r*0.2;
      ctx.beginPath(); ctx.moveTo(gx, cy + r*0.15); ctx.lineTo(gx + r*0.08, cy + r*0.32); ctx.lineTo(gx + r*0.16, cy + r*0.15); ctx.closePath(); ctx.fill();
    }
  }
  else if(difficulty === 'Insane Demon'){
    var gID = ctx.createRadialGradient(cx - r*0.2, cy - r*0.2, r*0.1, cx, cy, r);
    gID.addColorStop(0, '#ff5555'); gID.addColorStop(1, '#990000');
    ctx.fillStyle = gID; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx - r*0.45, cy - r*0.3); ctx.lineTo(cx - r*0.85, cy - r*0.95); ctx.lineTo(cx - r*0.15, cy - r*0.55); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + r*0.45, cy - r*0.3); ctx.lineTo(cx + r*0.85, cy - r*0.95); ctx.lineTo(cx + r*0.15, cy - r*0.55); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.moveTo(cx - r*0.45, cy - r*0.15); ctx.lineTo(cx - r*0.08, cy - r*0.05); ctx.lineTo(cx - r*0.45, cy + r*0.1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + r*0.45, cy - r*0.15); ctx.lineTo(cx + r*0.08, cy - r*0.05); ctx.lineTo(cx + r*0.45, cy + r*0.1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffff00';
    ctx.beginPath(); ctx.arc(cx - r*0.24, cy - r*0.03, r*0.07, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r*0.24, cy - r*0.03, r*0.07, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.moveTo(cx - r*0.38, cy + r*0.1); ctx.lineTo(cx + r*0.38, cy + r*0.1);
    ctx.lineTo(cx + r*0.32, cy + r*0.5); ctx.lineTo(cx - r*0.32, cy + r*0.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    for(var id2=0; id2<5; id2++){
      var ix = cx - r*0.32 + id2 * r*0.16;
      ctx.beginPath(); ctx.moveTo(ix, cy + r*0.1); ctx.lineTo(ix + r*0.07, cy + r*0.3); ctx.lineTo(ix + r*0.14, cy + r*0.1); ctx.closePath(); ctx.fill();
    }
  }
  else if(difficulty === 'Extreme Demon'){
    var aura = ctx.createRadialGradient(cx, cy, r*0.4, cx, cy, r*1.3);
    aura.addColorStop(0, 'rgba(255,0,0,0.6)');
    aura.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(cx, cy, r*1.3, 0, Math.PI*2); ctx.fill();

    var gXD = ctx.createRadialGradient(cx - r*0.2, cy - r*0.2, r*0.1, cx, cy, r);
    gXD.addColorStop(0, '#ff2222'); gXD.addColorStop(1, '#550000');
    ctx.fillStyle = gXD; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx - r*0.45, cy - r*0.3); ctx.lineTo(cx - r*0.9, cy - r*1.0); ctx.lineTo(cx - r*0.12, cy - r*0.6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + r*0.45, cy - r*0.3); ctx.lineTo(cx + r*0.9, cy - r*1.0); ctx.lineTo(cx + r*0.12, cy - r*0.6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - r*0.15, cy - r*0.5); ctx.lineTo(cx, cy - r*1.0); ctx.lineTo(cx + r*0.15, cy - r*0.55); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.moveTo(cx - r*0.45, cy - r*0.15); ctx.lineTo(cx - r*0.08, cy - r*0.05); ctx.lineTo(cx - r*0.45, cy + r*0.1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + r*0.45, cy - r*0.15); ctx.lineTo(cx + r*0.08, cy - r*0.05); ctx.lineTo(cx + r*0.45, cy + r*0.1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffff00';
    ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(cx - r*0.24, cy - r*0.03, r*0.08, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r*0.24, cy - r*0.03, r*0.08, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.moveTo(cx - r*0.4, cy + r*0.1); ctx.lineTo(cx + r*0.4, cy + r*0.1);
    ctx.lineTo(cx + r*0.35, cy + r*0.55); ctx.lineTo(cx - r*0.35, cy + r*0.55);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    for(var xd=0; xd<6; xd++){
      var xx = cx - r*0.35 + xd * r*0.14;
      ctx.beginPath(); ctx.moveTo(xx, cy + r*0.1); ctx.lineTo(xx + r*0.06, cy + r*0.32); ctx.lineTo(xx + r*0.12, cy + r*0.1); ctx.closePath(); ctx.fill();
    }
    for(var xd2=0; xd2<5; xd2++){
      var xx2 = cx - r*0.28 + xd2 * r*0.14;
      ctx.beginPath(); ctx.moveTo(xx2, cy + r*0.55); ctx.lineTo(xx2 + r*0.06, cy + r*0.32); ctx.lineTo(xx2 + r*0.12, cy + r*0.55); ctx.closePath(); ctx.fill();
    }
  }
  else {
    ctx.fillStyle = '#ff8800';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }
}

// BACKGROUND
function drawBackground(theme, sky1, sky2){
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, sky1); g.addColorStop(1, sky2);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  for(var i=0; i<bgParticles.length; i++){
    var p = bgParticles[i];
    var px = (p.x - groundOffset * p.speed * 0.3) % W;
    if(px < 0) px += W;
    var py = p.y + Math.sin(time * 0.02 + p.phase) * 15;
    ctx.globalAlpha = p.alpha;
    
    if(theme === 'neon'){ ctx.fillStyle = '#00ffff'; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 10; }
    else if(theme === 'ocean'){ ctx.fillStyle = '#88ddff'; ctx.shadowColor = '#88ddff'; ctx.shadowBlur = 8; }
    else if(theme === 'forest'){ ctx.fillStyle = '#88ff88'; ctx.shadowColor = '#88ff88'; ctx.shadowBlur = 8; }
    else if(theme === 'lava'){ ctx.fillStyle = '#ffaa44'; ctx.shadowColor = '#ffaa44'; ctx.shadowBlur = 10; }
    else if(theme === 'electric'){ ctx.fillStyle = '#cc44ff'; ctx.shadowColor = '#cc44ff'; ctx.shadowBlur = 10; }
    else if(theme === 'hell'){ ctx.fillStyle = '#ff4444'; ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 10; }
    else if(theme === 'cosmic'){ ctx.fillStyle = '#ff88ff'; ctx.shadowColor = '#ff88ff'; ctx.shadowBlur = 10; }
    else if(theme === 'tidal'){ ctx.fillStyle = '#44ddff'; ctx.shadowColor = '#44ddff'; ctx.shadowBlur = 12; }
    else if(theme === 'blood'){ ctx.fillStyle = '#ff2222'; ctx.shadowColor = '#ff2222'; ctx.shadowBlur = 12; }
    else { ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 8; }
    
    ctx.beginPath();
    ctx.arc(px, py, p.size, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  if(theme === 'blood'){
    for(var bl=0; bl<3; bl++){
      var bloodY = 100 + bl * 150 + Math.sin(time * 0.03 + bl) * 30;
      var bloodGrad = ctx.createRadialGradient(W/2, bloodY, 50, W/2, bloodY, 300);
      bloodGrad.addColorStop(0, 'rgba(200,0,0,0.15)');
      bloodGrad.addColorStop(1, 'rgba(200,0,0,0)');
      ctx.fillStyle = bloodGrad;
      ctx.beginPath(); ctx.arc(W/2, bloodY, 300, 0, Math.PI*2); ctx.fill();
    }
    for(var dr=0; dr<15; dr++){
      var dropX = (dr * 65 + time * 0.5) % W;
      var dropY = (time * 2 + dr * 40) % GROUND;
      ctx.fillStyle = 'rgba(180,0,0,0.6)';
      ctx.beginPath();
      ctx.ellipse(dropX, dropY, 3, 6, 0, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

// GROUND
function drawGround(theme, color1, color2, lineColor){
  var gg = ctx.createLinearGradient(0,GROUND,0,H);
  gg.addColorStop(0, color1); gg.addColorStop(1, color2);
  ctx.fillStyle = gg;
  ctx.fillRect(0, GROUND, W, H-GROUND);

  var offset = groundOffset % 40;

  if(theme === 'neon'){
    ctx.strokeStyle = 'rgba(0,255,255,0.3)'; ctx.lineWidth = 1.5;
    for(var x=-offset; x<W+40; x+=40){
      ctx.beginPath(); ctx.moveTo(x, GROUND+15); ctx.lineTo(x+20, GROUND+15); ctx.stroke();
    }
    ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3;
    ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  else if(theme === 'ocean'){
    ctx.strokeStyle = 'rgba(100,200,255,0.3)'; ctx.lineWidth = 2;
    for(var xo=-offset; xo<W+60; xo+=60){
      ctx.beginPath();
      for(var wx=0; wx<60; wx+=5){
        var wy = GROUND + 20 + Math.sin((xo + wx + time*2) * 0.05) * 5;
        if(wx === 0) ctx.moveTo(xo+wx, wy); else ctx.lineTo(xo+wx, wy);
      }
      ctx.stroke();
    }
    ctx.strokeStyle = '#00aaff'; ctx.lineWidth = 3;
    ctx.shadowColor = '#00aaff'; ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  else if(theme === 'forest'){
    for(var xf=-offset; xf<W+20; xf+=20){
      ctx.fillStyle = 'rgba(0,255,80,0.4)';
      ctx.beginPath();
      ctx.moveTo(xf, GROUND); ctx.lineTo(xf + 3, GROUND - 8); ctx.lineTo(xf + 6, GROUND);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 3;
    ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  else if(theme === 'lava'){
    for(var xl=-offset; xl<W+80; xl+=80){
      ctx.strokeStyle = 'rgba(255,100,0,0.6)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(xl, GROUND+10); ctx.lineTo(xl + 25, GROUND+25); ctx.lineTo(xl + 50, GROUND+15);
      ctx.stroke();
    }
    ctx.strokeStyle = '#ff4400'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  else if(theme === 'electric'){
    for(var xe=-offset; xe<W+100; xe+=100){
      ctx.strokeStyle = 'rgba(170,0,255,0.6)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(xe, GROUND+15); ctx.lineTo(xe + 40, GROUND+15);
      ctx.lineTo(xe + 40, GROUND+35); ctx.lineTo(xe + 70, GROUND+35);
      ctx.stroke();
      ctx.fillStyle = '#cc44ff'; ctx.shadowColor = '#cc44ff'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(xe + 40, GROUND+35, 4, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.strokeStyle = '#cc44ff'; ctx.lineWidth = 3;
    ctx.shadowColor = '#cc44ff'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  else if(theme === 'hell'){
    for(var xh=-offset; xh<W+120; xh+=120){
      ctx.fillStyle = 'rgba(220,220,220,0.4)';
      ctx.fillRect(xh, GROUND+25, 30, 4);
      ctx.beginPath(); ctx.arc(xh, GROUND+27, 5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(xh+30, GROUND+27, 5, 0, Math.PI*2); ctx.fill();
    }
    ctx.strokeStyle = '#ff0044'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ff0044'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  else if(theme === 'cosmic'){
    for(var xc=-offset; xc<W+80; xc+=80){
      var kh = 15 + Math.sin(xc) * 8;
      ctx.fillStyle = 'rgba(255,0,170,0.5)';
      ctx.beginPath();
      ctx.moveTo(xc, GROUND); ctx.lineTo(xc + 8, GROUND - kh); ctx.lineTo(xc + 16, GROUND);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = '#ff00aa'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ff00aa'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  else if(theme === 'tidal'){
    for(var waveLayer=0; waveLayer<3; waveLayer++){
      var waveOffsetY = 15 + waveLayer * 15;
      var alpha = 0.5 - waveLayer * 0.15;
      ctx.strokeStyle = 'rgba(0,220,255,' + alpha + ')';
      ctx.lineWidth = 4 - waveLayer;
      ctx.shadowColor = '#00ddff'; ctx.shadowBlur = 15;
      ctx.beginPath();
      for(var wx2=0; wx2<=W; wx2+=5){
        var wy2 = GROUND + waveOffsetY + Math.sin((wx2 + time*4 + waveLayer*100) * 0.03) * 8;
        if(wx2 === 0) ctx.moveTo(wx2, wy2); else ctx.lineTo(wx2, wy2);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    for(var bx2=0; bx2<W; bx2+=20){
      var by2 = GROUND + 15 + Math.sin((bx2 + time*4) * 0.03) * 8;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + Math.sin(time*0.1+bx2)*0.2) + ')';
      ctx.beginPath(); ctx.arc(bx2, by2, 2, 0, Math.PI*2); ctx.fill();
    }
    ctx.strokeStyle = '#00ddff'; ctx.lineWidth = 4;
    ctx.shadowColor = '#00ddff'; ctx.shadowBlur = 25;
    ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  else if(theme === 'blood'){
    for(var xbl=-offset; xbl<W+40; xbl+=40){
      ctx.fillStyle = 'rgba(200,0,0,0.5)';
      ctx.fillRect(xbl, GROUND+10, 20, 3);
      var dripY = (time * 3 + xbl * 10) % 40;
      if(dripY < 30){
        ctx.beginPath();
        ctx.ellipse(xbl + 10, GROUND + 20 + dripY, 3, 5, 0, 0, Math.PI*2);
        ctx.fill();
      }
    }
    for(var xbn=-offset; xbn<W+100; xbn+=100){
      ctx.fillStyle = 'rgba(220,200,200,0.3)';
      ctx.fillRect(xbn + 20, GROUND + 40, 25, 3);
      ctx.beginPath(); ctx.arc(xbn + 20, GROUND + 42, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(xbn + 45, GROUND + 42, 4, 0, Math.PI*2); ctx.fill();
    }
    ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 4;
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 25;
    ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  else {
    ctx.strokeStyle = lineColor; ctx.lineWidth = 3;
    ctx.shadowColor = lineColor; ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

// MENU
function drawMenu(){
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#00dd00'); g.addColorStop(1,'#009900');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  var tile = 90;
  var offsetX = (time * 0.4) % tile;
  for(var x=-tile + offsetX; x<W+tile; x+=tile){
    for(var y=-tile; y<H+tile; y+=tile){
      var cx = Math.floor((x - offsetX) / tile);
      var cy = Math.floor(y / tile);
      if((cx + cy) % 2 === 0){ ctx.fillStyle = 'rgba(0,255,0,0.15)'; }
      else { ctx.fillStyle = 'rgba(0,0,0,0.08)'; }
      ctx.fillRect(x, y, tile, tile);
    }
  }
  ctx.strokeStyle = 'rgba(0,150,0,0.4)';
  ctx.lineWidth = 1;
  for(var gx=-tile + offsetX; gx<W+tile; gx+=tile){
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
  }
  for(var gy=0; gy<H; gy+=tile){
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }

  drawChunkyTitle('GEOMETRY', W/2, 65, 62);
  drawChunkyTitle('DASH', W/2, 130, 62);

  var btn1X = W/2 - 230, btn1Y = 280;

  drawPlayButton(W/2, 280, 130, hoverBtn === 1);

  var btn3X = W/2 + 230, btn3Y = 280;
  drawButton(btn3X, btn3Y, 90, 90, '#4dd0e1', '#006064', hoverBtn === 2);

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, H - 90, W, 90);
  ctx.strokeStyle = '#003300';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, H - 90); ctx.lineTo(W, H - 90); ctx.stroke();

  drawSocialIcon(40, H - 55, 32, 'fb');
  drawSocialIcon(80, H - 55, 32, 'tw');
  drawSocialIcon(120, H - 55, 32, 'yt');

  ctx.save();
  ctx.translate(60, H - 20);
  ctx.fillStyle = '#ffeb3b';
  ctx.strokeStyle = '#e65100';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(-50, -12, 110, 22, 5);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#0a0a1a';
  ctx.font = 'bold 15px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('DeepSeek', 5, 0);
  ctx.restore();

  drawStatIcon(300, H - 55, 46, 'trophy');
  drawStatIcon(360, H - 55, 46, 'gear');
  drawStatIcon(420, H - 55, 46, 'bars');
  drawStatIcon(480, H - 55, 46, 'music');

  ctx.save();
  ctx.translate(W - 90, H - 55);
  ctx.fillStyle = '#4dd0e1';
  ctx.strokeStyle = '#006064';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(-70, -30, 140, 60, 8);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#80deea';
  ctx.fillRect(-66, -26, 132, 6);
  ctx.fillStyle = '#003300';
  ctx.font = 'bold 18px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('MORE', 0, -8);
  ctx.fillText('GAMES', 0, 12);

function drawCoinIcon(cx, cy, size, collected){
  var r = size / 2;
  ctx.fillStyle = collected ? '#666' : '#00ddff';
  ctx.shadowColor = collected ? '#666' : '#00ddff';
  ctx.shadowBlur = collected ? 0 : 15;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = collected ? '#333' : '#0088cc';
  ctx.beginPath(); ctx.arc(cx, cy, r*0.7, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = collected ? '#888' : '#ffffff';
  ctx.beginPath();
  for(var i=0; i<5; i++){
    var angle = (i * 4 * Math.PI / 5) - Math.PI/2;
    var x = cx + Math.cos(angle) * r*0.4;
    var y = cy + Math.sin(angle) * r*0.4;
    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();
}

function drawStar(cx, cy, size, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  for(var i=0; i<5; i++){
    var angle = (i * 4 * Math.PI / 5) - Math.PI/2;
    var x = cx + Math.cos(angle) * size;
    var y = cy + Math.sin(angle) * size;
    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
}

function drawMedal(cx, cy, size, type, unlocked){
  ctx.fillStyle = unlocked ? (type === 'silver' ? '#cccccc' : type === 'gold' ? '#ffdd00' : '#cc8844') : '#555555';
  ctx.beginPath(); ctx.arc(cx, cy, size/2, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = unlocked ? (type === 'silver' ? '#999999' : type === 'gold' ? '#ffaa00' : '#8b4513') : '#333333';
  ctx.beginPath(); ctx.arc(cx, cy, size/2 - 4, 0, Math.PI*2); ctx.fill();
  drawStar(cx, cy, size * 0.25, unlocked ? '#ffffff' : '#666666');
}

// GAMEPLAY
function drawGameplay(){
  var L = LEVELS[currentLevel];
  var c = ICON_COLORS[iconColorIndex];
  var theme = L.theme || 'default';

  ctx.save();
  if(shake > 0){
    var m = shake * 0.5;
    ctx.translate((Math.random()-0.5)*m*2, (Math.random()-0.5)*m*2);
  }

  drawBackground(theme, L.sky1, L.sky2);

  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  var off = groundOffset % 50;
  for(var x=off; x<W; x+=50){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,GROUND); ctx.stroke(); }
  for(var y=0; y<GROUND; y+=50){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  for(var ti=0; ti<trail.length; ti++){
    var t = trail[ti];
    ctx.fillStyle = 'rgba(255,0,68,' + (t.life*0.6) + ')';
    ctx.fillRect(t.x-5, t.y-5, 10, 10);
  }

  for(var si=0; si<slopes.length; si++){
    var sl = slopes[si];
    ctx.fillStyle = 'rgba(60,0,140,0.85)';
    ctx.strokeStyle = L.color; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sl.x, sl.y + sl.h);
    ctx.lineTo(sl.x + sl.w, sl.y);
    ctx.lineTo(sl.x + sl.w, sl.y + sl.h);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  for(var jpi=0; jpi<jumpPads.length; jpi++){
    var jp = jumpPads[jpi];
    ctx.fillStyle = '#ffdd00';
    ctx.shadowColor = '#ffdd00'; ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.roundRect(jp.x, jp.y, jp.w, jp.h, 4); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#f57f17'; ctx.lineWidth = 2; ctx.stroke();
  }

  for(var jri=0; jri<jumpRings.length; jri++){
    var jr = jumpRings[jri];
    ctx.strokeStyle = '#ffdd00'; ctx.lineWidth = 5;
    ctx.shadowColor = '#ffdd00'; ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.arc(jr.x + 20, jr.y + 20, 18, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  for(var spi=0; spi<speedPortals.length; spi++){
    var sp = speedPortals[spi];
    var pulse = 0.7 + Math.sin(Date.now()/150 + spi)*0.3;
    ctx.globalAlpha = 0.4 * pulse;
    ctx.fillStyle = sp.color;
    ctx.shadowColor = sp.color; ctx.shadowBlur = 30;
    ctx.fillRect(sp.x - 10, sp.y, sp.w + 20, sp.h);
    ctx.globalAlpha = 1;
    ctx.fillRect(sp.x, sp.y, sp.w, sp.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('»', sp.x + sp.w/2, sp.y + sp.h/2);
  }

  if(L.name === 'AQUA CHAOS' && currentMode === 'wave'){
    ctx.strokeStyle = 'rgba(255,100,100,0.5)';
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 10]);
    ctx.beginPath(); ctx.moveTo(0, CEILING); ctx.lineTo(W, CEILING); ctx.stroke();
    ctx.setLineDash([]);
  }

  for(var oi=0; oi<obstacles.length; oi++){
    var o = obstacles[oi];
    var isFloating = o.y < GROUND - 100;
    if(o.type === 'spike'){
      ctx.fillStyle = '#ff0066';
      ctx.shadowColor = '#ff0066'; ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.moveTo(o.x, o.y+o.h); ctx.lineTo(o.x+o.w/2, o.y); ctx.lineTo(o.x+o.w, o.y+o.h);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ff66aa'; ctx.lineWidth = 2; ctx.stroke();
    } else if(o.type === 'spike_down'){
      ctx.fillStyle = '#ff0066';
      ctx.shadowColor = '#ff0066'; ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.moveTo(o.x, o.y); ctx.lineTo(o.x+o.w/2, o.y+o.h); ctx.lineTo(o.x+o.w, o.y);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ff66aa'; ctx.lineWidth = 2; ctx.stroke();
    } 
    else if(o.type === 'spike_pit'){
      ctx.fillStyle = '#ff0066';
      ctx.shadowColor = '#ff0066'; ctx.shadowBlur = 20;
      var spikeCount = 5;
      var spikeW = o.w / spikeCount;
      ctx.beginPath();
      ctx.moveTo(o.x, o.y + o.h);
      for(var sp2=0; sp2<spikeCount; sp2++){
        var sx = o.x + sp2 * spikeW;
        ctx.lineTo(sx + spikeW/2, o.y);
        ctx.lineTo(sx + spikeW, o.y + o.h);
      }
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ff66aa'; ctx.lineWidth = 2; ctx.stroke();
    }
    else {
      if(isFloating){ ctx.fillStyle = 'rgba(120,0,180,0.85)'; ctx.shadowColor = '#cc44ff'; }
      else { ctx.fillStyle = 'rgba(60,0,140,0.85)'; ctx.shadowColor = '#8800ff'; }
      ctx.shadowBlur = 12;
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = isFloating ? '#cc44ff' : L.color;
      ctx.lineWidth = 2;
      ctx.strokeRect(o.x, o.y, o.w, o.h);
    }
  }

  for(var lci=0; lci<levelCoins.length; lci++){
    var coin = levelCoins[lci];
    if(!coin.collected) drawLevelCoin(coin);
  }

  for(var pi=0; pi<portals.length; pi++){
    var p = portals[pi];
    var pulse2 = 0.7 + Math.sin(Date.now()/150 + pi)*0.3;
    ctx.globalAlpha = 0.25 * pulse2;
    ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 40;
    ctx.fillRect(p.x - 15, p.y, p.w + 30, p.h);
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;

    var pg = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
    pg.addColorStop(0, p.color); pg.addColorStop(0.5, '#ffffff'); pg.addColorStop(1, p.color);
    ctx.fillStyle = pg;
    ctx.shadowColor = p.color; ctx.shadowBlur = 20;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.shadowBlur = 0;
  }

  drawGround(theme, L.groundColor1, L.groundColor2, L.color);

  if(practiceMode){
    for(var cpi=0; cpi<checkpoints.length; cpi++){
      var cp = checkpoints[cpi];
      var cpPulse = 0.7 + Math.sin(Date.now()/200 + cpi)*0.3;
      ctx.globalAlpha = 0.5 * cpPulse;
      ctx.fillStyle = '#00ff88';
      ctx.fillRect(cp.x - 5, cp.y - 5, 50, 50);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 3;
      ctx.strokeRect(cp.x - 5, cp.y - 5, 50, 50);
      ctx.fillStyle = '#00ff88';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('★', cp.x + 20, cp.y + 20);
    }
  }

  ctx.save();
  ctx.translate(player.x+20, player.y+20);
  ctx.rotate(player.rot);
  ctx.shadowColor = c; ctx.shadowBlur = 25;
  drawPlayerByMode(currentMode, c);
  ctx.restore();

  for(var pai=0; pai<particles.length; pai++){
    var pa = particles[pai];
    ctx.globalAlpha = pa.life;
    ctx.fillStyle = pa.color;
    ctx.shadowColor = pa.color; ctx.shadowBlur = 10;
    ctx.fillRect(pa.x-pa.size/2, pa.y-pa.size/2, pa.size, pa.size);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  ctx.fillStyle = c;
  ctx.font = 'bold 22px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('Score: ' + score, 20, 30);
  ctx.fillStyle = '#ff66ff'; ctx.font = 'bold 14px Arial';
  ctx.fillText('Attempt: ' + attempt, 20, 52);
  ctx.fillStyle = c;
  ctx.fillText('Mode: ' + getModeData(currentMode).name, 20, 72);

  ctx.fillStyle = L.diffColor;
  ctx.font = 'bold 12px Arial';
  ctx.fillText(L.difficulty, 20, 92);

  if(practiceMode){
    ctx.fillStyle = '#00ddff'; ctx.font = 'bold 14px Arial';
    ctx.fillText('PRACTICE', 20, 115);
  }

  ctx.fillStyle = '#00ddff';
  ctx.font = 'bold 14px Arial';
  ctx.fillText('Coin: ' + collectedLevelCoins.length + '/3', 20, practiceMode ? 135 : 115);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffaa00'; ctx.font = 'bold 16px Arial';
  ctx.fillText('Best: ' + best, W-20, 30);

  var pct = Math.min(distance/L.length, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(100, 48, W-200, 10);
  ctx.fillStyle = practiceMode ? '#00ddff' : L.color;
  ctx.shadowColor = practiceMode ? '#00ddff' : L.color;
  ctx.shadowBlur = 10;
  ctx.fillRect(100, 48, (W-200)*pct, 10);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'white'; ctx.lineWidth = 1;
  ctx.strokeRect(100, 48, W-200, 10);
  ctx.fillStyle = 'white'; ctx.font = 'bold 12px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(Math.floor(pct*100) + '%', W/2, 45);

  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = 'bold 11px Arial';
  ctx.textAlign = 'right';
  ctx.fillText('Z = Checkpoint | X = Respawn | R = Restart | ESC = Menu', W-20, H-15);

  ctx.restore();
}

function drawLevelCoin(coin){
  var cx = coin.x + 20, cy = coin.y + 20;
  var spin = Math.sin(coin.spin);
  var w = 16 * Math.abs(spin) + 4;
  var h = 32;
  ctx.shadowColor = '#00ddff'; ctx.shadowBlur = 25;
  ctx.fillStyle = '#00ddff';
  ctx.beginPath(); ctx.ellipse(cx, cy, w, h/2, 0, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0088cc';
  ctx.beginPath(); ctx.ellipse(cx, cy, w * 0.7, h * 0.35, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  for(var i=0; i<5; i++){
    var angle = (i * 4 * Math.PI / 5) - Math.PI/2;
    var x = cx + Math.cos(angle) * w*0.4;
    var y = cy + Math.sin(angle) * w*0.4;
    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();
}

function drawPlayerByMode(mode, c){
  if(mode === 'cube'){
    ctx.fillStyle = c; ctx.fillRect(-20,-20,40,40);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(-20,-20,40,40);
    ctx.fillStyle = '#fff'; ctx.fillRect(-12,-12,24,24);
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-8,-8,6,6); ctx.fillRect(2,-8,6,6); ctx.fillRect(-6,4,12,3);
  }
  else if(mode === 'ship'){
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(-26, 0); ctx.lineTo(-16, -12); ctx.lineTo(6, -16); ctx.lineTo(22, -8);
    ctx.lineTo(26, 0); ctx.lineTo(22, 8); ctx.lineTo(6, 16); ctx.lineTo(-16, 12);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(0, -4, 10, 7, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.stroke();
    ctx.fillStyle = '#0a0a1a';
    ctx.beginPath(); ctx.arc(-3, -4, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff8800';
    ctx.beginPath(); ctx.moveTo(-26, -3); ctx.lineTo(-36, 0); ctx.lineTo(-26, 3); ctx.closePath(); ctx.fill();
  }
  else if(mode === 'ball'){
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0a0a1a';
    ctx.beginPath(); ctx.arc(-5,-3,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-3,3,0,Math.PI*2); ctx.fill();
    ctx.fillRect(-6,5,12,3);
  }
  else if(mode === 'ufo'){
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.ellipse(0,5,22,10,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-3,12,10,0,Math.PI,0); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0,5,22,10,0,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0,-5,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0a0a1a';
    ctx.beginPath(); ctx.arc(0,-5,3,0,Math.PI*2); ctx.fill();
  }
  else if(mode === 'wave'){
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(-26, 0); ctx.lineTo(-10, -14); ctx.lineTo(20, 0); ctx.lineTo(-10, 14);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4, 0, 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#0a0a1a';
    ctx.beginPath(); ctx.arc(-4, 0, 2.5, 0, Math.PI*2); ctx.fill();
  }
  else if(mode === 'robot'){
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.fillStyle = c;
    ctx.fillRect(-16, -52, 4, 8); ctx.strokeRect(-16, -52, 4, 8);
    ctx.fillRect(12, -52, 4, 8); ctx.strokeRect(12, -52, 4, 8);
    ctx.fillStyle = c; ctx.fillRect(-22, -45, 44, 22); ctx.strokeRect(-22, -45, 44, 22);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-12, -38, 9, 9); ctx.strokeRect(-12, -38, 9, 9);
    ctx.fillRect(3, -38, 9, 9); ctx.strokeRect(3, -38, 9, 9);
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-9, -35, 4, 4); ctx.fillRect(6, -35, 4, 4);
    ctx.fillStyle = c; ctx.fillRect(-20, -22, 40, 30); ctx.strokeRect(-20, -22, 40, 30);
    ctx.fillStyle = c;
    ctx.fillRect(-14, 8, 9, 14); ctx.strokeRect(-14, 8, 9, 14);
    ctx.fillRect(5, 8, 9, 14); ctx.strokeRect(5, 8, 9, 14);
    ctx.fillStyle = '#666';
    ctx.beginPath();
    ctx.moveTo(-20, 20); ctx.lineTo(-8, 20); ctx.lineTo(-6, 22);
    ctx.lineTo(-6, 26); ctx.lineTo(-22, 26); ctx.lineTo(-22, 22);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-2, 20); ctx.lineTo(14, 20); ctx.lineTo(16, 22);
    ctx.lineTo(16, 26); ctx.lineTo(0, 26); ctx.lineTo(0, 22);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  else if(mode === 'spider'){
    var flip = (player.grav < 0);
    ctx.save();
    if(flip) ctx.scale(1, -1);

    ctx.strokeStyle = c; ctx.lineWidth = 3;

    for(var leg=0; leg<4; leg++){
      var legY = -18 + leg * 12;
      var legOff = 5 + Math.sin(time*0.1 + leg)*2;
      ctx.beginPath();
      ctx.moveTo(-18, legY);
      ctx.lineTo(-30 - legOff, legY - 8);
      ctx.lineTo(-38 - legOff, legY + 4);
      ctx.stroke();
    }
    for(var leg2=0; leg2<4; leg2++){
      var legY2 = -18 + leg2 * 12;
      var legOff2 = 5 + Math.sin(time*0.1 + leg2 + 2)*2;
      ctx.beginPath();
      ctx.moveTo(18, legY2);
      ctx.lineTo(30 + legOff2, legY2 - 8);
      ctx.lineTo(38 + legOff2, legY2 + 4);
      ctx.stroke();
    }

    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(-18,-18); ctx.lineTo(18,-18); ctx.lineTo(22,0); ctx.lineTo(18,18);
    ctx.lineTo(-18,18); ctx.lineTo(-22,0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-10,-10); ctx.lineTo(10,-10); ctx.lineTo(13,0); ctx.lineTo(10,10);
    ctx.lineTo(-10,10); ctx.lineTo(-13,0); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-7,-6,5,5); ctx.fillRect(2,-6,5,5);
    ctx.fillRect(-5,4,10,3);

    ctx.restore();
  }
}

// ===== PHYSICS =====
function updatePlayer(){
  var onSlope = false;
  for(var si=0; si<slopes.length; si++){
    var sl = slopes[si];
    if(player.x + player.w > sl.x && player.x < sl.x + sl.w){
      var relX = (player.x + player.w/2 - sl.x) / sl.w;
      var slopeY = sl.y + sl.h - relX * sl.h;
      if(player.y + player.h >= slopeY - 10){
        player.y = slopeY - player.h;
        player.vy = 0;
        player.onGround = true;
        onSlope = true;
      }
    }
  }
  
  if(currentMode === 'cube'){
    if(!onSlope){
      player.vy += 0.9; player.y += player.vy;
      if(player.y + player.h >= GROUND){
        player.y = GROUND - player.h; player.vy = 0;
        if(!player.onGround) burst(player.x+20, GROUND, 6, '#ffffff', 2);
        player.onGround = true;
        player.rot = Math.round(player.rot / (Math.PI/2)) * (Math.PI/2);
      } else { player.onGround = false; player.rot += 0.15; }
    }
  }
  else if(currentMode === 'ship'){
    if(inputHeld) player.vy -= 0.75; else player.vy += 0.55;
    player.vy = Math.max(-10, Math.min(10, player.vy));
    player.y += player.vy;
    if(player.y < CEILING){ player.y = CEILING; player.vy = 0; }
    if(player.y + player.h >= GROUND){ player.y = GROUND - player.h; player.vy = 0; player.onGround = true; }
    else player.onGround = false;
    player.rot = Math.max(-0.5, Math.min(0.5, player.vy * 0.05));
  }
  else if(currentMode === 'ball'){
    player.vy += 0.9;
    player.y += player.vy;
    
    if(player.y + player.h >= GROUND){
      player.y = GROUND - player.h; 
      player.vy = 0;
      player.onGround = true;
      player.rot = 0;
    } else {
      player.onGround = false;
      player.rot += 0.15;
    }
    player.grav = 1;
  }
  else if(currentMode === 'ufo'){
    player.vy += 0.9; player.y += player.vy;
    if(player.y < CEILING){ player.y = CEILING; player.vy = 0; }
    if(player.y + player.h >= GROUND){ player.y = GROUND - player.h; player.vy = 0; player.onGround = true; }
    else player.onGround = false;
    player.rot = 0;
  }
  else if(currentMode === 'wave'){
    var waveSpd = 7 * waveSpeedBoost;
    if(inputHeld) player.vy = -waveSpd; else player.vy = waveSpd;
    player.y += player.vy;
    if(player.y < CEILING){ player.y = CEILING; player.vy = 0; }
    if(player.y + player.h >= GROUND){ player.y = GROUND - player.h; player.vy = 0; player.onGround = true; }
    else player.onGround = false;
    player.rot = inputHeld ? -0.5 : 0.5;
    var maxTrail = (waveSpeedBoost > 1) ? 40 : 25;
    if(trail.length < maxTrail) trail.push({x:player.x+20, y:player.y+20, life:1});
  }
  else if(currentMode === 'robot'){
    player.vy += 0.9; player.y += player.vy;
    if(player.y + player.h >= GROUND){
      player.y = GROUND - player.h; player.vy = 0;
      if(!player.onGround) burst(player.x+20, GROUND, 6, '#ffffff', 2);
      player.onGround = true; player.rot = 0;
    } else { player.onGround = false; player.rot += 0.1; }
  }
  else if(currentMode === 'spider'){
    player.vy += 1.2;
    player.y += player.vy;
    
    if(player.y + player.h >= GROUND){
      player.y = GROUND - player.h; 
      player.vy = 0;
      player.onGround = true;
      player.grav = 1;
      player.rot = 0;
    } else if(player.y <= CEILING){
      player.y = CEILING; 
      player.vy = 0;
      player.onGround = true;
      player.grav = -1;
      player.rot = Math.PI;
    } else { 
      player.onGround = false; 
      player.rot += 0.25 * player.grav; 
    }
  }
}

function hit(a, b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function checkPortals(){
  for(var i=0; i<portals.length; i++){
    var p = portals[i];
    if(hit(player, p)){
      if(currentMode !== p.mode){
        currentMode = p.mode;
        player.grav = 1; player.vy = 0;
        if(p.mode === 'ship' || p.mode === 'ufo' || p.mode === 'wave') player.y = GROUND - 200;
        else player.y = GROUND - player.h;
        player.rot = 0;
        beep(900, 0.15, 'sine', 0.08);
        burst(player.x+20, player.y+20, 25, p.color, 6);
        portals.splice(i, 1);
        return;
      }
    }
  }
}

function checkSpeedPortals(){
  for(var i=0; i<speedPortals.length; i++){
    var sp = speedPortals[i];
    if(hit(player, {x: sp.x, y: sp.y, w: sp.w, h: sp.h})){
      if(sp.type === 'fast'){ speed = LEVELS[currentLevel].speed * 1.5; beep(1000, 0.1, 'sine', 0.06); }
      else if(sp.type === 'normal'){ speed = LEVELS[currentLevel].speed; beep(700, 0.1, 'sine', 0.06); }
      speedPortals.splice(i, 1);
      return;
    }
  }
}

function checkJumpPads(){
  for(var i=0; i<jumpPads.length; i++){
    var jp = jumpPads[i];
    if(!jp.used && hit(player, {x:jp.x, y:jp.y, w:jp.w, h:jp.h})){
      jp.used = true;
      player.vy = -18;
      player.onGround = false;
      beep(800, 0.15, 'sine', 0.08);
      burst(jp.x + 25, jp.y, 15, '#ffdd00', 5);
    }
  }
}

function checkJumpRings(){
  for(var i=0; i<jumpRings.length; i++){
    var jr = jumpRings[i];
    if(!jr.used && hit(player, {x:jr.x, y:jr.y, w:jr.w, h:jr.h})){
      jr.used = true;
      player.vy = -14;
      beep(1000, 0.15, 'sine', 0.08);
      burst(jr.x + 20, jr.y + 20, 15, '#ffdd00', 5);
    }
  }
}

function checkLevelCoins(){
  for(var i=0; i<levelCoins.length; i++){
    var coin = levelCoins[i];
    if(coin.collected) continue;
    if(hit(player, {x:coin.x, y:coin.y, w:coin.w, h:coin.h})){
      coin.collected = true;
      collectedLevelCoins.push(i);
      beep(1400, 0.1, 'sine', 0.08);
      setTimeout(function(){ beep(1800, 0.1, 'sine', 0.08); }, 60);
      burst(coin.x + 20, coin.y + 20, 20, '#00ddff', 6);
      saveCoin(i);
    }
  }
}

function addCheckpoint(){
  if(!practiceMode) return;
  var cp = {
    x: player.x, y: player.y, vy: player.vy,
    mode: currentMode, distance: distance, speed: speed
  };
  checkpoints.push(cp);
  lastCheckpoint = checkpoints.length - 1;
  beep(900, 0.1, 'sine', 0.06);
}

function respawnCheckpoint(){
  if(lastCheckpoint < 0 || lastCheckpoint >= checkpoints.length) return;
  var cp = checkpoints[lastCheckpoint];
  player.x = cp.x; player.y = cp.y; player.vy = cp.vy;
  currentMode = cp.mode;
  distance = cp.distance;
  speed = cp.speed;
  burst(player.x+20, player.y+20, 20, '#00ff88', 6);
}

function pressDown(){
  if(!playing || isDead) return;   // ⬅️ FIX: jangan respon kalau sudah mati
  inputHeld = true;
  statsData.totalJumps++;
  saveStats();
  
  if(currentMode === 'cube' && player.onGround){
    player.vy = -14; player.onGround = false;
    beep(600, 0.08, 'square', 0.05);
  } 
  else if(currentMode === 'robot'){
    if(player.onGround){
      player.vy = -11; player.onGround = false;
      beep(500, 0.08, 'square', 0.05);
    }
  } 
  else if(currentMode === 'ball'){
    if(player.onGround){
      player.vy = -15; 
      player.onGround = false;
      beep(500, 0.08, 'square', 0.05);
    }
  } 
  else if(currentMode === 'spider'){
    var atGround = player.y + player.h >= GROUND - 30;
    var atCeiling = player.y <= CEILING + 30;
    
    if(atGround){
      player.y = CEILING; 
      player.vy = 0; 
      player.grav = -1;
      player.onGround = true;
      beep(700, 0.08, 'sine', 0.05);
      burst(player.x+20, GROUND, 8, '#aa00ff', 4);
      burst(player.x+20, CEILING, 8, '#aa00ff', 4);
    } else if(atCeiling){
      player.y = GROUND - player.h; 
      player.vy = 0; 
      player.grav = 1;
      player.onGround = true;
      beep(500, 0.08, 'sine', 0.05);
      burst(player.x+20, CEILING, 8, '#aa00ff', 4);
      burst(player.x+20, GROUND, 8, '#aa00ff', 4);
    } else {
      var distGround = GROUND - (player.y + player.h);
      var distCeil = player.y - CEILING;
      if(distGround < distCeil){
        player.y = GROUND - player.h;
        player.grav = 1;
      } else {
        player.y = CEILING;
        player.grav = -1;
      }
      player.vy = 0;
      player.onGround = true;
      beep(600, 0.08, 'sine', 0.05);
    }
  }
}
function pressUp(){ inputHeld = false; }

document.addEventListener('keydown', function(e){
  if(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){
    e.preventDefault();
    if(!e.repeat){
      if(state === 'menu'){ state = 'levelInfo'; return; }
      if(state === 'levelInfo'){ return; }
      pressDown();
    }
  }
  if(e.code === 'ArrowLeft'){
    if(state === 'levelInfo'){
      currentLevel = (currentLevel - 1 + LEVELS.length) % LEVELS.length;
      beep(500, 0.08, 'square', 0.05);
    }
  }
  if(e.code === 'ArrowRight'){
    if(state === 'levelInfo'){
      currentLevel = (currentLevel + 1) % LEVELS.length;
      beep(500, 0.08, 'square', 0.05);
    }
  }
  if(e.code === 'KeyZ'){ if(playing && practiceMode && !isDead){ addCheckpoint(); } }
  if(e.code === 'KeyX'){ if(playing && practiceMode && !isDead){ respawnCheckpoint(); } }
  if(e.code === 'Escape'){
    if(playing || isDead){ backToLevelInfo(); }
    else if(state === 'levelInfo'){ state = 'menu'; }
  }
  if(e.code === 'KeyR'){
    if(state === 'playing' || isDead){ instantRestart(); }
  }
});
document.addEventListener('keyup', function(e){
  if(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') pressUp();
});

canvas.addEventListener('mousemove', function(e){
  var r = canvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * (W / r.width);
  mouseY = (e.clientY - r.top) * (H / r.height);
  hoverBtn = -1;

  if(state === 'menu'){
    if(Math.hypot(mouseX - (W/2 - 230), mouseY - 280) < 55) hoverBtn = 0;
    else if(Math.hypot(mouseX - W/2, mouseY - 280) < 75) hoverBtn = 1;
    else if(Math.hypot(mouseX - (W/2 + 230), mouseY - 280) < 55) hoverBtn = 2;
  }
  if(state === 'levelInfo'){
    if(mouseX < 70 && mouseY > 180 && mouseY < 300) hoverBtn = 0;
    else if(mouseX > W - 70 && mouseY > 180 && mouseY < 300) hoverBtn = 1;
    else if(mouseX > 150 && mouseX < W-150 && mouseY > 280 && mouseY < 330) hoverBtn = 2;
    else if(mouseX > 150 && mouseX < W-150 && mouseY > 375 && mouseY < 425) hoverBtn = 3;
  }
});

canvas.addEventListener('mousedown', function(e){
  initAudio();
  if(actx && actx.state === 'suspended') actx.resume();

  var r = canvas.getBoundingClientRect();
  var mx = (e.clientX - r.left) * (W / r.width);
  var my = (e.clientY - r.top) * (H / r.height);

  if(state === 'menu'){
    if(Math.hypot(mx - (W/2 - 230), my - 280) < 55){
      beep(700, 0.1, 'square', 0.06);
      alert('ICON KIT\n\nFitur akan datang.');
      return;
    }
    if(Math.hypot(mx - W/2, my - 280) < 75){
      beep(700, 0.1, 'square', 0.07);
      state = 'levelInfo';
      return;
    }
    if(Math.hypot(mx - (W/2 + 230), my - 280) < 55){
      beep(1000, 0.05, 'sine', 0.05);
      iconColorIndex = (iconColorIndex + 1) % ICON_COLORS.length;
      return;
    }
    return;
  }

  if(state === 'levelInfo'){
    if(mx > 15 && mx < 65 && my > 15 && my < 55){
      beep(500, 0.1, 'square', 0.05);
      state = 'menu';
      return;
    }
    if(mx < 70 && my > 180 && my < 300){
      currentLevel = (currentLevel - 1 + LEVELS.length) % LEVELS.length;
      beep(500, 0.08, 'square', 0.05);
      return;
    }
    if(mx > W - 70 && my > 180 && my < 300){
      currentLevel = (currentLevel + 1) % LEVELS.length;
      beep(500, 0.08, 'square', 0.05);
      return;
    }
    if(mx > 150 && mx < W-150 && my > 290 && my < 335){
      beep(700, 0.1, 'square', 0.07);
      startLevel(false);
      return;
    }
    if(mx > 150 && mx < W-150 && my > 385 && my < 430){
      beep(600, 0.1, 'square', 0.07);
      startLevel(true);
      return;
    }
    return;
  }

  if(playing) pressDown();
});

canvas.addEventListener('mouseup', function(){ pressUp(); });

canvas.addEventListener('touchstart', function(e){
  e.preventDefault();
  initAudio();
  if(actx && actx.state === 'suspended') actx.resume();
  var t = e.touches[0];
  var r = canvas.getBoundingClientRect();
  var mx = (t.clientX - r.left) * (W / r.width);
  var my = (t.clientY - r.top) * (H / r.height);

  if(state === 'menu'){
    if(Math.hypot(mx - W/2, my - 280) < 75){ state = 'levelInfo'; return; }
    if(Math.hypot(mx - (W/2 + 230), my - 280) < 55){
      iconColorIndex = (iconColorIndex + 1) % ICON_COLORS.length; return;
    }
    return;
  }
  if(state === 'levelInfo'){
    if(mx > 15 && mx < 65 && my > 15 && my < 55){ state = 'menu'; return; }
    if(mx < 70 && my > 180 && my < 300){ currentLevel = (currentLevel - 1 + LEVELS.length) % LEVELS.length; return; }
    if(mx > W - 70 && my > 180 && my < 300){ currentLevel = (currentLevel + 1) % LEVELS.length; return; }
    if(mx > 150 && mx < W-150 && my > 290 && my < 335){ startLevel(false); return; }
    if(mx > 150 && mx < W-150 && my > 385 && my < 430){ startLevel(true); return; }
    return;
  }
  if(playing) pressDown();
}, {passive:false});
canvas.addEventListener('touchend', function(e){ e.preventDefault(); pressUp(); }, {passive:false});

function update(){
  time++;
  if(shake > 0) shake--;

  for(var bpi=0; bpi<bgParticles.length; bpi++){
    bgParticles[bpi].x -= bgParticles[bpi].speed * 0.3;
    if(bgParticles[bpi].x < -10) bgParticles[bpi].x = W + 10;
  }

  for(var i=particles.length-1; i>=0; i--){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.02;
    if(p.life <= 0) particles.splice(i,1);
  }
  for(var j=trail.length-1; j>=0; j--){
    trail[j].life -= 0.05; trail[j].x -= speed;
    if(trail[j].life <= 0 || trail[j].x < -50) trail.splice(j,1);
  }
  for(var k=0; k<levelCoins.length; k++) levelCoins[k].spin += 0.08;

  // ⬅️ FIX: jangan update kalau mati
  if(!playing || isDead) return;

  updatePlayer();

  for(var oi=0; oi<obstacles.length; oi++) obstacles[oi].x -= speed;
  obstacles = obstacles.filter(function(o){ return o.x + o.w > -100; });
  for(var pi=0; pi<portals.length; pi++) portals[pi].x -= speed;
  portals = portals.filter(function(p){ return p.x + p.w > -100; });
  for(var lci2=0; lci2<levelCoins.length; lci2++) levelCoins[lci2].x -= speed;
  for(var spi2=0; spi2<speedPortals.length; spi2++) speedPortals[spi2].x -= speed;
  for(var jpi2=0; jpi2<jumpPads.length; jpi2++) jumpPads[jpi2].x -= speed;
  for(var jri2=0; jri2<jumpRings.length; jri2++) jumpRings[jri2].x -= speed;
  for(var sli2=0; sli2<slopes.length; sli2++) slopes[sli2].x -= speed;
  for(var cpi2=0; cpi2<checkpoints.length; cpi2++) checkpoints[cpi2].x -= speed;

  groundOffset = (groundOffset - speed) % 40;
  distance += speed;
  score = Math.floor(distance / 10);

  checkPortals();
  checkSpeedPortals();
  checkJumpPads();
  checkJumpRings();
  checkLevelCoins();

  var L = LEVELS[currentLevel];
  if(distance >= L.length){
    winGame();
    return;
  }

  for(var i2=0; i2<obstacles.length; i2++){
    var o = obstacles[i2];
    if(hit(player, o)){
      if(o.type === 'spike' || o.type === 'spike_down' || o.type === 'spike_pit'){ 
        if(practiceMode && lastCheckpoint >= 0){ respawnCheckpoint(); }
        else { die(); }
        return; 
      }
      if(o.type === 'block'){
        if(currentMode === 'cube' || currentMode === 'robot' || currentMode === 'spider'){
          var prevY = player.y - player.vy;
          if(prevY + player.h <= o.y + 5 && player.vy >= 0){
            player.y = o.y - player.h; player.vy = 0; player.onGround = true;
          } else { 
            if(practiceMode && lastCheckpoint >= 0){ respawnCheckpoint(); }
            else { die(); }
            return; 
          }
        } else { 
          if(practiceMode && lastCheckpoint >= 0){ respawnCheckpoint(); }
          else { die(); }
          return; 
        }
      }
    }
  }
}

function render(){
  ctx.clearRect(0, 0, W, H);
  if(state === 'menu'){ drawMenu(); }
  else if(state === 'levelInfo'){ drawLevelInfo(); }
  else if(state === 'playing' || isDead){ drawGameplay(); }
}

function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}
loop();

} catch(err) {
  var el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'FATAL: ' + err.message + '\n' + err.stack;
}
</script>
</body>
</html>
